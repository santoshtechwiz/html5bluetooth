<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLE Connector PWA</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#007bff">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
        }
        h1 { color: #007bff; margin-bottom: 1rem; }
        p { color: #666; margin-bottom: 2rem; line-height: 1.5; }
        
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 5px;
            font-weight: 600;
            color: #555;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            box-shadow: 0 4px 12px rgba(0,123,255,0.3);
            margin-bottom: 10px;
        }
        button:hover {
            background: #0056b3;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(0,123,255,0.4);
        }
        button:active { transform: translateY(0); }
        button.secondary {
            background: #6c757d;
            box-shadow: 0 4px 12px rgba(108,117,125,0.3);
        }
        button.secondary:hover { background: #5a6268; }

        #status {
            margin-top: 25px;
            font-weight: 500;
            color: #555;
            padding: 10px;
            border-radius: 10px;
            background: #f8f9fa;
            word-break: break-all;
        }

        .explorer-section {
            margin-top: 30px;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 20px;
            max-height: 500px;
            overflow-y: auto;
        }
        .service-item {
            background: #e9ecef;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 0.9rem;
            border-left: 5px solid #007bff;
        }
        .char-item {
            background: #fff;
            border: 1px solid #eee;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            margin-left: 15px;
            font-size: 0.85rem;
        }
        .char-props {
            font-size: 0.75rem;
            color: #888;
            display: block;
            margin-bottom: 8px;
        }
        .value-display {
            background: #f1f1f1;
            padding: 8px;
            border-radius: 5px;
            font-family: monospace;
            margin: 10px 0;
            white-space: pre-wrap;
            font-size: 0.8rem;
        }
        .action-btn {
            padding: 6px 12px;
            font-size: 0.8rem;
            width: auto;
            border-radius: 5px;
            margin-right: 5px;
            margin-bottom: 5px;
            box-shadow: none;
        }
        .write-group {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }
        .write-group input {
            flex: 1;
            padding: 6px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>BLE Connector PWA</h1>
        <p>Interactive BLE Diagnostic Tool</p>

        <div class="input-group">
            <label>Target Service UUID (Optional)</label>
            <select id="commonUUIDs" onchange="document.getElementById('serviceUUID').value = this.value">
                <option value="">-- Select Common UUID --</option>
                <option value="00001800-0000-1000-8000-00805f9b34fb">Generic Access</option>
                <option value="00001801-0000-1000-8000-00805f9b34fb">Generic Attribute</option>
                <option value="0000180d-0000-1000-8000-00805f9b34fb">Heart Rate</option>
                <option value="0000180f-0000-1000-8000-00805f9b34fb">Battery Service</option>
                <option value="feaa">Custom / Generic (Short UUID)</option>
            </select>
            <input type="text" id="serviceUUID" placeholder="e.g. 0000180d-0000-1000-8000-00805f9b34fb" style="margin-top:10px;">
            <small style="color:#999; font-size: 0.75rem;">Add UUID to avoid "Origin not allowed" errors.</small>
        </div>

        <button id="connectBtn">Connect to Device</button>
        <button id="disconnectBtn" class="secondary" style="display:none;">Disconnect</button>
        
        <div id="status">Status: Disconnected</div>

        <div id="explorer" class="explorer-section" style="display:none;">
            <button id="exploreBtn" class="secondary">Explore Device Services</button>
            <div id="servicesList" style="margin-top:20px;"></div>
        </div>
    </div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const exploreBtn = document.getElementById('exploreBtn');
        const statusDiv = document.getElementById('status');
        const explorerDiv = document.getElementById('explorer');
        const servicesList = document.getElementById('servicesList');
        const serviceUUIDInput = document.getElementById('serviceUUID');

        let connectedDevice = null;
        let connectedServer = null;

        connectBtn.addEventListener('click', async () => {
            statusDiv.innerText = "Status: Searching...";
            
            try {
                const serviceUUID = serviceUUIDInput.value.trim();
                const options = {
                    acceptAllDevices: true,
                    optionalServices: []
                };

                if (serviceUUID) {
                    options.optionalServices.push(serviceUUID);
                }

                const device = await navigator.bluetooth.requestDevice(options);
                connectedDevice = device;

                statusDiv.innerText = `Status: Connecting to ${device.name || 'Unknown'}...`;
                
                const server = await device.gatt.connect();
                connectedServer = server;

                statusDiv.innerText = `Status: Connected to ${device.name || 'Unknown'}! ✅`;
                
                connectBtn.style.display = 'none';
                disconnectBtn.style.display = 'block';
                explorerDiv.style.display = 'block';

                device.addEventListener('gattserverdisconnected', onDisconnected);

            } catch (error) {
                console.error("Connection Error: ", error);
                let friendlyError = error.message;
                if (error.name === 'NotFoundError') friendlyError = "No device selected.";
                else if (error.name === 'SecurityError') friendlyError = "Security block: Use HTTPS/localhost.";
                else if (error.message.includes('unsupported')) friendlyError = "Only BLE devices are supported.";
                
                statusDiv.innerText = `Status: Error - ${friendlyError}`;
            }
        });

        disconnectBtn.addEventListener('click', () => {
            if (connectedDevice && connectedDevice.gatt.connected) {
                connectedDevice.gatt.disconnect();
            }
        });

        function onDisconnected() {
            statusDiv.innerText = "Status: Disconnected";
            connectBtn.style.display = 'block';
            disconnectBtn.style.display = 'none';
            explorerDiv.style.display = 'none';
            connectedServer = null;
            connectedDevice = null;
        }

        exploreBtn.addEventListener('click', async () => {
            if (!connectedServer) return;
            statusDiv.innerText = "Status: Exploring services...";
            servicesList.innerHTML = 'Searching for services...';

            try {
                const services = await connectedServer.getPrimaryServices();
                servicesList.innerHTML = '';

                if (services.length === 0) {
                    servicesList.innerHTML = '<div style="color:#888;">No primary services found. <br>Tip: Enter the Service UUID before connecting.</div>';
                    return;
                }

                for (const service of services) {
                    const serviceEl = document.createElement('div');
                    serviceEl.className = 'service-item';
                    serviceEl.innerText = `Service: ${service.uuid}`;
                    servicesList.appendChild(serviceEl);

                    const characteristics = await service.getCharacteristics();
                    for (const char of characteristics) {
                        const charEl = document.createElement('div');
                        charEl.className = 'char-item';

                        const props = [];
                        if (char.properties.read) props.push('Read');
                        if (char.properties.write) props.push('Write');
                        if (char.properties.writeWithoutResponse) props.push('WriteNoResp');
                        if (char.properties.notify) props.push('Notify');

                        charEl.innerHTML = `
                            <strong>Char:</strong> ${char.uuid}<br>
                            <span class="char-props">Props: ${props.join(', ')}</span>
                            <div id="val-${char.uuid}" class="value-display" style="display:none;"></div>
                        `;

                        if (char.properties.read) {
                            const readBtn = document.createElement('button');
                            readBtn.innerText = 'Read';
                            readBtn.className = 'action-btn';
                            readBtn.onclick = async () => {
                                try {
                                    const val = await char.readValue();
                                    displayValue(char.uuid, val);
                                } catch (e) { alert('Read failed: ' + e.message); }
                            };
                            charEl.appendChild(readBtn);
                        }

                        if (char.properties.write || char.properties.writeWithoutResponse) {
                            const writeGroup = document.createElement('div');
                            writeGroup.className = 'write-group';
                            
                            const writeInput = document.createElement('input');
                            writeInput.type = 'text';
                            writeInput.placeholder = 'Text to send...';
                            
                            const writeBtn = document.createElement('button');
                            writeBtn.innerText = 'Send';
                            writeBtn.className = 'action-btn';
                            writeBtn.onclick = async () => {
                                try {
                                    const text = writeInput.value;
                                    const encoder = new TextEncoder();
                                    const data = encoder.encode(text);
                                    await char.writeValue(data);
                                    statusDiv.innerText = "Status: Sent successfully! ✅";
                                } catch (e) { alert('Write failed: ' + e.message); }
                            };
                            
                            writeGroup.appendChild(writeInput);
                            writeGroup.appendChild(writeBtn);
                            charEl.appendChild(writeGroup);
                        }

                        if (char.properties.notify) {
                            const notifyBtn = document.createElement('button');
                            notifyBtn.innerText = 'Start Notify';
                            notifyBtn.className = 'action-btn secondary';
                            notifyBtn.onclick = async () => {
                                try {
                                    await char.startNotifications();
                                    notifyBtn.innerText = 'Notify: ON';
                                    notifyBtn.style.background = '#28a745';
                                    char.addEventListener('characteristicvaluechanged', (event) => {
                                        displayValue(char.uuid, event.target.value);
                                    });
                                } catch (e) { alert('Notify failed: ' + e.message); }
                            };
                            charEl.appendChild(notifyBtn);
                        }

                        servicesList.appendChild(charEl);
                    }
                }
                statusDiv.innerText = "Status: Exploration complete! ✅";
            } catch (error) {
                console.error("Explore Error: ", error);
                statusDiv.innerText = `Status: Explore Error - ${error.message}`;
            }
        });

        function displayValue(uuid, dataView) {
            const display = document.getElementById(`val-${uuid}`);
            display.style.display = 'block';
            const buffer = dataView.buffer;
            const hex = Array.from(new Uint8Array(buffer))
                             .map(b => b.toString(16).padStart(2, '0'))
                             .join(' ');
            let text = '';
            try { text = new TextDecoder().decode(buffer); } catch(e) {}
            display.innerText = `Hex: ${hex}\nText: ${text}`;
        }
    </script>
</body>
</html>
